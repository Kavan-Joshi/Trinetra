asyncapi: 2.6.0
info:
  title: Trinetra Event Bus
  version: 1.0.0
  description: |
    Asynchronous integration contract for the Trinetra federated CCTV platform.
    Federated edge gateways publish normalised detection events; the correlator
    consumes them and publishes alerts; watchlist changes fan out to all
    correlator instances. Raw video never crosses this bus — only structured
    events, evidence-frame references, and alert payloads (the "move events, not
    video" thesis). Transport is NATS JetStream; subjects are stable and
    versioned under the `trinetra.*` namespace.
servers:
  production:
    url: nats://state-dc:4222
    protocol: nats
    description: NATS JetStream cluster (3-node per range) at the State Data Centre.
channels:
  trinetra.events.raw:
    description: Normalised detection events emitted by federated gateway adapters.
    publish:
      message:
        $ref: '#/components/messages/DetectionEvent'
    subscribe:
      message:
        $ref: '#/components/messages/DetectionEvent'
  trinetra.alerts.new:
    description: Alerts generated by the correlator (watchlist hit or anomaly), fanned to operators and the notifier.
    publish:
      message:
        $ref: '#/components/messages/AlertPayload'
    subscribe:
      message:
        $ref: '#/components/messages/AlertPayload'
  trinetra.watchlist.changed:
    description: Notification that the watchlist changed; correlator instances refresh their Redis cache.
    publish:
      message:
        $ref: '#/components/messages/WatchlistChanged'
    subscribe:
      message:
        $ref: '#/components/messages/WatchlistChanged'
components:
  messages:
    DetectionEvent:
      name: DetectionEvent
      title: Normalised detection event
      contentType: application/json
      payload:
        $ref: '#/components/schemas/DetectionEvent'
    AlertPayload:
      name: AlertPayload
      title: Alert payload
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AlertPayload'
    WatchlistChanged:
      name: WatchlistChanged
      title: Watchlist changed notification
      contentType: application/json
      payload:
        type: object
        properties:
          changed: { type: boolean }
          source: { type: string, description: manual | cctns | records-sync }
  schemas:
    DetectionEvent:
      type: object
      required: [event_id, camera_id, ts, kind]
      properties:
        event_id: { type: string, format: uuid }
        camera_id: { type: string }
        ts: { type: string, format: date-time }
        kind: { type: string, enum: [vehicle, person, object] }
        plate_raw: { type: string, nullable: true }
        plate_confidence: { type: number, format: float, nullable: true }
        vehicle_class: { type: string, nullable: true }
        color: { type: string, nullable: true }
        direction: { type: string, nullable: true }
        speed_kmh: { type: number, nullable: true }
        bbox: { type: array, items: { type: integer } }
        attributes: { type: object, additionalProperties: true }
        snapshot_path: { type: string, nullable: true }
    AlertPayload:
      type: object
      required: [alert_id, event_id, category, title, camera_id, ts, confidence, lat, lon]
      properties:
        alert_id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        watchlist_id: { type: integer, nullable: true }
        category: { type: string, enum: [stolen_vehicle, blacklisted_vehicle, wanted_person, missing_person, suspect, anomaly] }
        title: { type: string }
        plate: { type: string, nullable: true }
        description: { type: string }
        camera_id: { type: string }
        camera_name: { type: string }
        ts: { type: string, format: date-time }
        confidence: { type: number }
        lat: { type: number }
        lon: { type: number }
        snapshot_path: { type: string, nullable: true }
        source_system: { type: string, description: manual | cctns | vahan | nafis }
        source_ref: { type: string, nullable: true, description: FIR/record reference }
        enrichment: { type: object, additionalProperties: true, description: VAHAN/SARTHI/NAFIS enrichment }
